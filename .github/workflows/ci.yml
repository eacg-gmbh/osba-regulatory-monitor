name: ci
on:
  push:
    branches:
       - main
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.x
      # Zensical liest die bestehende mkdocs.yml. Auf einen Build-Cache wird
      # verzichtet, Zensical empfiehlt ihn fuer CI derzeit nicht.
      - run: pip install zensical ghp-import
      - run: zensical build --clean
      # Zensical kennt kein "gh-deploy". ghp-import veroeffentlicht site/ wie
      # bisher auf dem Branch gh-pages (dasselbe Werkzeug nutzte mkdocs intern).
      - run: ghp-import --no-jekyll --push --force --message "Deployed ${GITHUB_SHA::7} with Zensical" site
